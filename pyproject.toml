[project]
name = "ht-schatten-experiments"
version = "0.1.0"
description = "Reproducibility code for Schatten Muon and noise-ratio experiments."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate==1.2.1",
    "datasets==3.1.0",
    "huggingface-hub==0.26.2",
    "numpy==2.2.2",
    "pyyaml>=6.0",
    "torch==2.10.0",
    "tqdm==4.66.4",
    "transformers>=4.47.0",
    "matplotlib==3.10.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
